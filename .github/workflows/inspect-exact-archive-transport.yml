name: Inspect exact archive transport
on:
  push:
    paths:
      - '.github/workflows/inspect-exact-archive-transport.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify and inspect saved contiguous prefix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma, re
          from pathlib import Path
          folder = Path('.github/avito-exact-archives-20260912')
          cursor = json.loads(Path('подбор авито расширение/PUBLICATION_CURSOR_2026-09-12.json').read_text())
          for row in cursor['transport']['observed_parts']:
              p = folder / row['path']
              b = p.read_bytes()
              blob = hashlib.sha1(b'blob ' + str(len(b)).encode() + b'\0' + b).hexdigest()
              assert len(b) == row['bytes'] and blob == row['git_blob_sha'], p
          parts = []
          i = 0
          while (folder / f'part-{i:03d}.b64').exists():
              parts.append((folder / f'part-{i:03d}.b64').read_bytes())
              i += 1
          packed = base64.b64decode(b''.join(parts), validate=True)
          dec = lzma.LZMADecompressor()
          raw = dec.decompress(packed)
          text = raw.decode('utf-8', errors='replace')
          print('CONTIGUOUS_PARTS', i, 'PACKED_BYTES', len(packed), 'DECOMPRESSED_BYTES', len(raw), 'EOF', dec.eof)
          # Enumerate object member names by nesting depth without printing file bodies.
          depth = 0
          in_string = False
          escape = False
          start = 0
          members = []
          for j, c in enumerate(text):
              if in_string:
                  if escape:
                      escape = False
                  elif c == '\\':
                      escape = True
                  elif c == '"':
                      in_string = False
                      k = j + 1
                      while k < len(text) and text[k].isspace(): k += 1
                      if k < len(text) and text[k] == ':' and depth <= 4:
                          key = text[start + 1:j]
                          if len(key) < 100:
                              members.append((depth, key, start))
                  continue
              if c == '"': in_string = True; start = j
              elif c in '{[': depth += 1
              elif c in '}]': depth -= 1
          seen = set()
          for d, k, off in members:
              if (d, k) in seen: continue
              seen.add((d,k))
              print('MEMBER', d, k, off)
          decoder = json.JSONDecoder()
          idx = text.find('"archives":[') + len('"archives":')
          try:
              archives, end = decoder.raw_decode(text, idx)
              print('ARCHIVES_COMPLETE', len(archives), 'END', end)
              for a in archives:
                  print('ARCHIVE_KEYS', a['name'], list(a))
                  for key, value in a.items():
                      if key == 'files': continue
                      if isinstance(value, str): print('FIELD', key, 'len', len(value), 'prefix', value[:100])
                      elif isinstance(value, (list, dict)):
                          print('FIELD', key, 'type', type(value).__name__, 'len', len(value))
                          if value: print('FIRST', repr(value[0] if isinstance(value,list) else next(iter(value.items())))[:600])
                      else: print('FIELD', key, repr(value))
              print('AFTER_ARCHIVES', text[end:end+1500])
          except json.JSONDecodeError as e:
              print('ARCHIVES_INCOMPLETE', e.pos, str(e))
          print('TAIL', text[-1000:])
          PY
