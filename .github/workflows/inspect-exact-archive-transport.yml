name: Inspect exact archive transport
on:
  push:
    paths:
      - '.github/workflows/inspect-exact-archive-transport.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify saved parts and export complete metadata from partial stream
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma, shutil
          from pathlib import Path
          folder = Path('.github/avito-exact-archives-20260912')
          cursor = json.loads(Path('подбор авито расширение/PUBLICATION_CURSOR_2026-09-12.json').read_text())
          out = Path('transport-inspection')
          out.mkdir()
          for row in cursor['transport']['observed_parts']:
              p = folder / row['path']
              b = p.read_bytes()
              blob = hashlib.sha1(b'blob ' + str(len(b)).encode() + b'\0' + b).hexdigest()
              assert len(b) == row['bytes'] and blob == row['git_blob_sha'], p
              shutil.copy2(p, out / p.name)
          parts = []
          i = 0
          while (folder / f'part-{i:03d}.b64').exists():
              parts.append((folder / f'part-{i:03d}.b64').read_bytes())
              i += 1
          packed = base64.b64decode(b''.join(parts), validate=True)
          dec = lzma.LZMADecompressor()
          raw = dec.decompress(packed)
          text = raw.decode('utf-8', errors='strict')
          (out / 'remote-prefix.bin').write_bytes(raw)
          decoder = json.JSONDecoder()
          idx = text.find('"archives":[') + len('"archives":')
          archives, end = decoder.raw_decode(text, idx)
          (out / 'archives.json').write_text(json.dumps(archives, ensure_ascii=False, separators=(',', ':')))
          report = {'parts': i, 'packed_bytes': len(packed), 'decoded_bytes': len(raw), 'complete_stream': dec.eof, 'decoded_prefix_sha256': hashlib.sha256(raw).hexdigest(), 'archives_count': len(archives)}
          (out / 'inspection.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report))
          for a in archives:
              print(a['name'], 'RECIPES', len(a['recipe']))
              print('RECIPE_1', a['recipe'][1])
              print('RECIPE_2', a['recipe'][2])
              print('LAST_RECIPE_KEYS', list(a['recipe'][-1]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exact-transport-recovery-evidence
          path: transport-inspection/
          retention-days: 30
          if-no-files-found: error
