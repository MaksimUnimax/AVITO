name: Diagnose Avito Finder v1.0.42 full regression
on:
  push:
    branches: [fix/v142-writing-block-payload-oscillation-2026-09-13]
    paths:
      - '.github/workflows/diag-avito-v142-regression.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BRANCH: fix/v142-writing-block-payload-oscillation-2026-09-13
      RELEASE: подбор авито расширение/releases/v1.0.42
      WORK: подбор авито расширение/releases/v1.0.42/v142_work
      OUTDIR: подбор авито расширение/releases/v1.0.42/QA/regression_diagnostics
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/v142-writing-block-payload-oscillation-2026-09-13, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Prepare Chromium
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
          BROWSER=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          echo "CHROMIUM=$BROWSER" >> "$GITHUB_ENV"
          if [ ! -e /usr/bin/chromium ]; then sudo ln -s "$BROWSER" /usr/bin/chromium; fi
      - name: Materialize exact candidate
        shell: bash
        run: |
          set -euo pipefail
          python tools/materialize_avito_v142.py >/tmp/materialize_v142.log 2>&1
      - name: Run full grouped regression without masking evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUTDIR"
          set +e
          AF_QA_OUTPUT="$OUTDIR" python -u "$WORK/tests/run_all_v136.py" > "$OUTDIR/runner.stdout.log" 2>&1
          RC=$?
          set -e
          printf '%s\n' "$RC" > "$OUTDIR/runner.exit_code"
          cat "$OUTDIR/runner.stdout.log"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('подбор авито расширение/releases/v1.0.42/QA/regression_diagnostics/summary.json')
          if p.exists():
            r=json.loads(p.read_text());print(json.dumps(r,ensure_ascii=False,indent=2))
          PY
      - name: Persist regression failure evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$OUTDIR"
          if ! git diff --cached --quiet; then
            git commit -m 'qa: persist v1.0.42 full regression diagnostics'
            git push origin "HEAD:$BRANCH"
          fi
