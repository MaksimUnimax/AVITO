name: Build and verify Avito Finder v1.0.38 sticky recovery
on:
  push:
    branches: [fix/v138-avito-sticky-recovery-2026-09-13]
    paths: ['.github/workflows/build-avito-v138.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: avito-v138-sticky-recovery
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      checked_commit: ${{ steps.finish.outputs.commit }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      BRANCH: fix/v138-avito-sticky-recovery-2026-09-13
      BASE: подбор авито расширение/releases/v1.0.37/v137_work
      RELEASE: подбор авито расширение/releases/v1.0.38
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v138-avito-sticky-recovery-2026-09-13
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Chromium dependencies
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+MaksimUnimax@users.noreply.github.com'
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
          BROWSER=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          echo "CHROMIUM=$BROWSER" >> "$GITHUB_ENV"
          if [ ! -e /usr/bin/chromium ]; then sudo ln -s "$BROWSER" /usr/bin/chromium; fi
      - name: Verify exact v1.0.37 base authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile
          r=Path('подбор авито расширение/releases/v1.0.37')
          b=json.loads((r/'BUILD_v1.0.37.json').read_text())
          assert b['archive_sha256']=='4eaf64038ffd6c5b08ed7d97fdb0d13848edd8a7a9db04ad928f74b1f371ac9d'
          z=r/b['archive']
          assert hashlib.sha256(z.read_bytes()).hexdigest()==b['archive_sha256']
          with zipfile.ZipFile(z) as f:
              assert f.testzip() is None and len(f.namelist())==144
          assert json.loads((Path('подбор авито расширение/releases/v1.0.37/v137_work/manifest.json')).read_text())['version']=='1.0.37'
          PY
      - name: Prove RED on exact v1.0.37
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE/QA/red"
          set +e
          AF_SOURCE_ROOT="$BASE" node --test "$RELEASE/tests/sticky_recovery_v138.test.js" > "$RELEASE/QA/red/sticky_recovery.tap" 2>&1
          RC=$?
          set -e
          test "$RC" -eq 1
          grep -q '# fail 1' "$RELEASE/QA/red/sticky_recovery.tap"
          grep -q 'Avito recovery must request Proxy.Market sticky session' "$RELEASE/QA/red/sticky_recovery.tap"
      - name: Materialize minimal v1.0.38 patch from exact base
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RELEASE/v138_work" "$RELEASE/QA/worktree" "$RELEASE/QA/final_zip"
          cp -a "$BASE" "$RELEASE/v138_work"
          cp "$RELEASE/tests/sticky_recovery_v138.test.js" "$RELEASE/v138_work/tests/"
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('подбор авито расширение/releases/v1.0.38/v138_work')
          sw=root/'service_worker.js'
          s=sw.read_text()
          old1="await ProxyCore.createProxyInPackage(request,apiKey,{package_id:packageId,country:profile.country||'ru',rotation:0});"
          new1="await ProxyCore.createProxyInPackage(request,apiKey,{package_id:packageId,country:profile.country||'ru',rotation:-1});"
          old2="const candidate=profiles.find(p=>!beforeIds.has(String(p.id)) && p.rotation_settings?.rotate===0 && p.package_id===packageId);"
          new2="const candidate=profiles.find(p=>!beforeIds.has(String(p.id)) && p.rotation_settings?.rotate===-1 && p.package_id===packageId);"
          assert s.count(old1)==1, s.count(old1)
          assert s.count(old2)==1, s.count(old2)
          s=s.replace(old1,new1).replace(old2,new2)
          sw.write_text(s)
          m=root/'manifest.json'; data=json.loads(m.read_text()); assert data['version']=='1.0.37'; data['version']='1.0.38'; data['version_name']='1.0.38-avito-sticky-recovery'; data['description']='Avito Finder: bounded visible-UI execution with same-chat reports and sticky residential recovery escalation for Avito; manual CAPTCHA.'; m.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          a=root/'avito_content.js'; x=a.read_text(); assert x.count('const ADAPTER_VERSION = "1.0.37";')==1; a.write_text(x.replace('const ADAPTER_VERSION = "1.0.37";','const ADAPTER_VERSION = "1.0.38";'))
          p=root/'tests/v135_prompt_form_terminal_gate.test.py'; x=p.read_text(); assert '"version": "1.0.37"' in x; x=x.replace('"version": "1.0.37"','"version": "1.0.38"').replace("print('v1.0.37 prompt form terminal gate PASS')","print('v1.0.38 prompt form terminal gate PASS')"); p.write_text(x)
          # Preserve the security boundary: API key remains session-scoped. No local secret persistence is introduced.
          PY
      - name: Assert minimal runtime diff and write source metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          base=Path('подбор авито расширение/releases/v1.0.37/v137_work'); new=Path('подбор авито расширение/releases/v1.0.38/v138_work')
          changed=[]
          rels=set([p.relative_to(base) for p in base.rglob('*') if p.is_file()]+[p.relative_to(new) for p in new.rglob('*') if p.is_file()])
          for r in sorted(rels):
              a=base/r;b=new/r
              if not a.exists() or not b.exists() or a.read_bytes()!=b.read_bytes(): changed.append(str(r))
          prod=[x for x in changed if not x.startswith('tests/') and x not in {'README.md','SHA256SUMS.txt','BUILD_ORIGIN_v1.0.38.json'}]
          assert prod==['avito_content.js','manifest.json','service_worker.js'],prod
          for f in ['chatgpt_content.js','core.js','proxy_manager.js','recovery.js','popup.js','popup.html','popup.css']:
              assert (base/f).read_bytes()==(new/f).read_bytes(),f
          H=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          origin={'version':'1.0.38','date':'2026-09-13','base_version':'1.0.37','base_archive_sha256':'4eaf64038ffd6c5b08ed7d97fdb0d13848edd8a7a9db04ad928f74b1f371ac9d','runtime_changed':prod,'runtime_unchanged':['chatgpt_content.js','core.js','proxy_manager.js','recovery.js','popup.js','popup.html','popup.css'],'root_cause':'Avito recovery-created residential endpoint hardcoded rotation=0 (every request); provider semantics make each HTTP request use a new IP, while observed Avito flow requires a stable session after IP-block/CAPTCHA.','recovery_created_rotation':-1,'api_key_storage_contract':'session-scoped unchanged','navigation_queue_cursor_changed':False,'captcha_automation_added':False,'live_provider_calls_during_patch':0,'installed_live_acceptance':'NOT_RUN'}
          (new/'BUILD_ORIGIN_v1.0.38.json').write_text(json.dumps(origin,ensure_ascii=False,indent=2)+'\n')
          readme='''# Avito Finder v1.0.38\n\nMinimal patch over exact v1.0.37. Avito recovery endpoint creation requests Proxy.Market sticky rotation (-1) instead of every-request rotation (0), and reconciliation accepts only the sticky endpoint. Queue/navigation/capture/proxy manager are unchanged. API key remains session-scoped. CAPTCHA remains manual.\n'''
          (new/'README.md').write_text(readme)
          rows=[]
          for p in sorted(new.rglob('*')):
              if not p.is_file() or '__pycache__' in p.parts: continue
              rel=str(p.relative_to(new))
              if rel=='SHA256SUMS.txt': continue
              rows.append(f'{H(p)}  {rel}')
          (new/'SHA256SUMS.txt').write_text('\n'.join(rows)+'\n')
          (Path('подбор авито расширение/releases/v1.0.38')/'MATERIALIZATION.json').write_text(json.dumps({'changed_paths':changed,'production_runtime_changed':prod,'status':'PASS'},ensure_ascii=False,indent=2)+'\n')
          PY
      - name: GREEN targeted sticky-recovery regression
        shell: bash
        run: |
          set -euo pipefail
          AF_SOURCE_ROOT="$RELEASE/v138_work" node --test "$RELEASE/tests/sticky_recovery_v138.test.js" | tee "$RELEASE/QA/targeted_green.tap"
          grep -q '# pass 1' "$RELEASE/QA/targeted_green.tap"
          grep -q '# fail 0' "$RELEASE/QA/targeted_green.tap"
      - name: Full existing regression from v1.0.38 worktree
        shell: bash
        run: |
          set -euo pipefail
          AF_QA_OUTPUT="$RELEASE/QA/worktree" python -u "$RELEASE/v138_work/tests/run_all_v136.py"
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('подбор авито расширение/releases/v1.0.38/QA/worktree/summary.json').read_text())
          assert d['complete'] and d['pass']==35 and d['fail']==0,d
          PY
      - name: Package final v1.0.38 ZIP and fresh-extract full regression
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$RELEASE/AVITO_FINDER_v1.0.38_AVITO_STICKY_RECOVERY_2026-09-13.zip"
          python tools/package_avito_v138.py "$RELEASE/v138_work" "$ZIP"
          FINAL=$(mktemp -d); export FINAL
          python - <<'PY'
          import os,zipfile,json,hashlib
          from pathlib import Path
          root=Path('подбор авито расширение/releases/v1.0.38'); build=json.loads((root/'BUILD_v1.0.38.json').read_text()); z=root/build['archive']
          assert hashlib.sha256(z.read_bytes()).hexdigest()==build['archive_sha256']
          with zipfile.ZipFile(z) as f:
              assert f.testzip() is None and len(f.namelist())==build['source_files']
              f.extractall(os.environ['FINAL'])
          PY
          AF_SOURCE_ROOT="$FINAL/v138_work" node --test "$RELEASE/tests/sticky_recovery_v138.test.js" | tee "$RELEASE/QA/final_targeted_green.tap"
          AF_QA_OUTPUT="$RELEASE/QA/final_zip" python -u "$FINAL/v138_work/tests/run_all_v136.py"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('подбор авито расширение/releases/v1.0.38'); a=json.loads((root/'QA/worktree/summary.json').read_text()); b=json.loads((root/'QA/final_zip/summary.json').read_text()); build=json.loads((root/'BUILD_v1.0.38.json').read_text())
          assert a['complete'] and a['pass']==35 and a['fail']==0
          assert b['complete'] and b['pass']==35 and b['fail']==0
          receipt={'version':'1.0.38','status':'FINAL_ZIP_OFFLINE_QA_PASS_LIVE_UNVERIFIED','archive':build['archive'],'sha256':build['archive_sha256'],'bytes':build['archive_bytes'],'source_files':build['source_files'],'targeted_sticky_recovery':'PASS','worktree_groups_pass':35,'worktree_groups_fail':0,'final_zip_groups_pass':35,'final_zip_groups_fail':0,'installed_live_acceptance':'NOT_RUN','live_provider_calls':0}
          (root/'CHECKPOINT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - name: Persist exact source ZIP and QA on patch branch
        id: finish
        shell: bash
        run: |
          set -euo pipefail
          git add -- "$RELEASE" tools/package_avito_v138.py
          if ! git diff --cached --quiet; then
            git commit -m 'build: persist Avito Finder v1.0.38 sticky recovery release candidate'
            git push origin HEAD:"$BRANCH"
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: avito-v138-sticky-recovery-build
          path: подбор авито расширение/releases/v1.0.38/
          if-no-files-found: error
  remote-readback:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.checked_commit }}
          fetch-depth: 0
      - name: Verify final ZIP/source bytes and QA in independent checkout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,subprocess,zipfile
          from pathlib import Path
          root=Path('подбор авито расширение/releases/v1.0.38'); build=json.loads((root/'BUILD_v1.0.38.json').read_text()); z=root/build['archive']
          assert hashlib.sha256(z.read_bytes()).hexdigest()==build['archive_sha256'] and len(z.read_bytes())==build['archive_bytes']
          q1=json.loads((root/'QA/worktree/summary.json').read_text());q2=json.loads((root/'QA/final_zip/summary.json').read_text());assert q1['pass']==35 and q1['fail']==0 and q2['pass']==35 and q2['fail']==0
          with zipfile.ZipFile(z) as f:
              assert f.testzip() is None and len(f.namelist())==build['source_files']
              for n,h in build['source_hashes'].items():
                  b=f.read('v138_work/'+n); a=(root/'v138_work'/n).read_bytes(); assert a==b and hashlib.sha256(a).hexdigest()==h,n
          origin=json.loads((root/'v138_work/BUILD_ORIGIN_v1.0.38.json').read_text()); assert origin['runtime_changed']==['avito_content.js','manifest.json','service_worker.js'] and origin['recovery_created_rotation']==-1
          r={'scope':'INDEPENDENT_FRESH_GITHUB_CHECKOUT_V138','verified_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'version':'1.0.38','archive':build['archive'],'sha256':build['archive_sha256'],'bytes':build['archive_bytes'],'source_files_byte_equal':build['source_files'],'worktree_groups_pass':35,'final_zip_groups_pass':35,'groups_fail':0,'sticky_recovery':'PASS','status':'PASS','installed_live_acceptance':'NOT_RUN'}
          (root/'REMOTE_READBACK.json').write_text(json.dumps(r,indent=2)+'\n')
          PY
      - name: Persist remote readback receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+MaksimUnimax@users.noreply.github.com'
          git add -- 'подбор авито расширение/releases/v1.0.38/REMOTE_READBACK.json'
          git commit -m 'qa: persist independent v1.0.38 remote readback'
          git push origin HEAD:fix/v138-avito-sticky-recovery-2026-09-13
      - uses: actions/upload-artifact@v4
        with:
          name: avito-v138-remote-verified
          path: подбор авито расширение/releases/v1.0.38/
          if-no-files-found: error
