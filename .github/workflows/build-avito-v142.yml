name: Build and verify Avito Finder v1.0.42 Writing Block capture stability
on:
  push:
    branches: [fix/v142-writing-block-payload-oscillation-2026-09-13]
    paths:
      - '.github/workflows/build-avito-v142.yml'
      - 'tools/materialize_avito_v142.py'
      - 'подбор авито расширение/v142_prepatch_tests/writing_block_capture_green.py'
      - 'подбор авито расширение/releases/v1.0.42/QA/red/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: avito-v142-writing-block-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      persisted_commit: ${{ steps.persist.outputs.commit }}
    env:
      BRANCH: fix/v142-writing-block-payload-oscillation-2026-09-13
      RELEASE: подбор авито расширение/releases/v1.0.42
      WORK: подбор авито расширение/releases/v1.0.42/v142_work
      ZIP: подбор авито расширение/releases/v1.0.42/AVITO_FINDER_v1.0.42_WRITING_BLOCK_CAPTURE_STABILITY_RECOVERY_2026-09-13.zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v142-writing-block-payload-oscillation-2026-09-13
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Prepare Chromium
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
          BROWSER=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          echo "CHROMIUM=$BROWSER" >> "$GITHUB_ENV"
          if [ ! -e /usr/bin/chromium ]; then sudo ln -s "$BROWSER" /usr/bin/chromium; fi
      - name: Verify Rule 20 and persisted exact-v1.0.41 RED
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('подбор авито расширение/PRE_PATCH_FULL_HISTORY_AUDIT_v1.0.42_2026-09-13.json').read_text())
          rb=json.loads(Path('подбор авито расширение/PRE_PATCH_FULL_HISTORY_AUDIT_v1.0.42_REMOTE_READBACK_2026-09-13.json').read_text())
          red=json.loads(Path('подбор авито расширение/releases/v1.0.42/QA/red/RED.json').read_text())
          assert a['status']=='FULL_HISTORY_AUDIT=PASS' and a['installed_exact_target']=='v1.0.41',a
          assert rb['status']=='PASS' and rb['runtime_changed_during_audit'] is False,rb
          assert red['status']=='RED_CONFIRMED' and red['source_version']=='1.0.41',red
          assert red['primary']['broken_behavior_observed'] is True,red['primary']
          assert red['secondary']['broken_behavior_observed'] is True,red['secondary']
          assert red['runtime_changed_before_red'] is False,red
          print('Rule20 + exact v1.0.41 RED authority PASS')
          PY
      - name: Materialize minimal v1.0.42 from exact v1.0.41
        shell: bash
        run: |
          set -euo pipefail
          python tools/materialize_avito_v142.py | tee /tmp/materialize_v142.log
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          base=Path('подбор авито расширение/releases/v1.0.41/v141_work')
          work=Path('подбор авито расширение/releases/v1.0.42/v142_work')
          o=json.loads((work/'BUILD_ORIGIN_v1.0.42.json').read_text())
          m=json.loads((work/'manifest.json').read_text())
          assert m['version']=='1.0.42',m
          assert o['runtime_behavior_changed']==['chatgpt_content.js'],o
          assert o['service_worker_byte_identical_to_v141'] is True,o
          assert o['proxy_manager_byte_identical_to_v141'] is True,o
          assert (base/'service_worker.js').read_bytes()==(work/'service_worker.js').read_bytes()
          assert (base/'proxy_manager.js').read_bytes()==(work/'proxy_manager.js').read_bytes()
          print('minimal-diff materialization PASS')
          PY
      - name: Targeted GREEN — production capture state machine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE/QA"
          AF_SOURCE_ROOT="$GITHUB_WORKSPACE/$WORK" AF_GREEN_OUT="$GITHUB_WORKSPACE/$RELEASE/QA/targeted_green.json" python 'подбор авито расширение/v142_prepatch_tests/writing_block_capture_green.py' | tee "$RELEASE/QA/targeted_green.log"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('подбор авито расширение/releases/v1.0.42/QA/targeted_green.json')
          r=json.loads(p.read_text()); assert r['status']=='PASS' and len(r['scenarios'])==3 and all(x['pass'] for x in r['scenarios']),r
          print('targeted GREEN 3/3 PASS')
          PY
      - name: Full historical regression — worktree
        shell: bash
        run: |
          set -euo pipefail
          AF_QA_OUTPUT="$RELEASE/QA/worktree" python -u "$WORK/tests/run_all_v136.py"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('подбор авито расширение/releases/v1.0.42/QA/worktree/summary.json')
          r=json.loads(p.read_text()); assert r['complete'] and r['fail']==0,r
          print('worktree grouped QA PASS',r['pass'])
          PY
      - name: Package exact final source and write build authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          rel=Path('подбор авито расширение/releases/v1.0.42')
          work=rel/'v142_work'; zpath=rel/'AVITO_FINDER_v1.0.42_WRITING_BLOCK_CAPTURE_STABILITY_RECOVERY_2026-09-13.zip'
          if zpath.exists(): zpath.unlink()
          files=sorted(p for p in work.rglob('*') if p.is_file())
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for p in files:
              info=zipfile.ZipInfo(str(Path('v142_work')/p.relative_to(work)).replace('\\','/'),date_time=(2020,1,1,0,0,0));info.compress_type=zipfile.ZIP_DEFLATED;info.external_attr=(0o100644<<16)
              z.writestr(info,p.read_bytes())
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          wqa=json.loads((rel/'QA/worktree/summary.json').read_text())
          build={'schema':'avito_finder_build_v142','version':'1.0.42','base_version':'1.0.41','archive':zpath.name,'archive_sha256':sha(zpath),'archive_bytes':zpath.stat().st_size,'source_files':len(files),'runtime_behavior_changed':['chatgpt_content.js'],'identity_only_changed':['avito_content.js','manifest.json'],'service_worker_byte_identical_to_v141':(work/'service_worker.js').read_bytes()==Path('подбор авито расширение/releases/v1.0.41/v141_work/service_worker.js').read_bytes(),'proxy_manager_byte_identical_to_v141':(work/'proxy_manager.js').read_bytes()==Path('подбор авито расширение/releases/v1.0.41/v141_work/proxy_manager.js').read_bytes(),'chatgpt_content_sha256':sha(work/'chatgpt_content.js'),'avito_content_sha256':sha(work/'avito_content.js'),'manifest_sha256':sha(work/'manifest.json'),'targeted_green':'3/3 PASS','worktree_grouped_qa':f"{wqa['pass']}/{wqa['pass']} PASS",'installed_live_e2e':'NOT_RUN / LIVE_UNVERIFIED'}
          (rel/'BUILD_v1.0.42.json').write_text(json.dumps(build,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(build,ensure_ascii=False,indent=2))
          PY
      - name: Fresh-extract targeted GREEN and full regression
        shell: bash
        run: |
          set -euo pipefail
          FINAL="$RUNNER_TEMP/v142_final"; rm -rf "$FINAL"; mkdir -p "$FINAL"; export FINAL
          python - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          r=Path('подбор авито расширение/releases/v1.0.42');b=json.loads((r/'BUILD_v1.0.42.json').read_text());z=r/b['archive']
          assert hashlib.sha256(z.read_bytes()).hexdigest()==b['archive_sha256']
          with zipfile.ZipFile(z) as f:
            assert f.testzip() is None and len(f.namelist())==b['source_files'];f.extractall(os.environ['FINAL'])
          PY
          AF_SOURCE_ROOT="$FINAL/v142_work" AF_GREEN_OUT="$GITHUB_WORKSPACE/$RELEASE/QA/final_targeted_green.json" python 'подбор авито расширение/v142_prepatch_tests/writing_block_capture_green.py' | tee "$RELEASE/QA/final_targeted_green.log"
          AF_QA_OUTPUT="$RELEASE/QA/final_zip" python -u "$FINAL/v142_work/tests/run_all_v136.py"
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('подбор авито расширение/releases/v1.0.42');a=json.loads((r/'QA/worktree/summary.json').read_text());b=json.loads((r/'QA/final_zip/summary.json').read_text());g=json.loads((r/'QA/final_targeted_green.json').read_text());build=json.loads((r/'BUILD_v1.0.42.json').read_text())
          assert a['complete'] and a['fail']==0,a
          assert b['complete'] and b['fail']==0,b
          assert a['pass']==b['pass'],(a,b)
          assert g['status']=='PASS' and all(x['pass'] for x in g['scenarios']),g
          build['final_zip_grouped_qa']=f"{b['pass']}/{b['pass']} PASS";build['final_targeted_green']='3/3 PASS';build['final_zip_fresh_extract']='PASS'
          (r/'BUILD_v1.0.42.json').write_text(json.dumps(build,ensure_ascii=False,indent=2)+'\n')
          print('fresh-extract QA PASS',b['pass'])
          PY
      - name: Persist exact source ZIP and QA
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$RELEASE"
          git commit -m 'release: materialize Avito Finder v1.0.42 capture stability candidate'
          git push origin "HEAD:$BRANCH"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  remote_readback:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRANCH: fix/v142-writing-block-payload-oscillation-2026-09-13
      RELEASE: подбор авито расширение/releases/v1.0.42
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v142-writing-block-payload-oscillation-2026-09-13
          fetch-depth: 0
      - name: Independent remote readback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$BRANCH)"
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          r=Path('подбор авито расширение/releases/v1.0.42');b=json.loads((r/'BUILD_v1.0.42.json').read_text());z=r/b['archive'];work=r/'v142_work'
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          assert sha(z)==b['archive_sha256']
          assert sha(work/'chatgpt_content.js')==b['chatgpt_content_sha256']
          assert json.loads((work/'manifest.json').read_text())['version']=='1.0.42'
          assert b['final_zip_fresh_extract']=='PASS' and b['installed_live_e2e']=='NOT_RUN / LIVE_UNVERIFIED',b
          rb={'schema':'avito_finder_v142_remote_readback','version':'1.0.42','status':'PASS','branch':'fix/v142-writing-block-payload-oscillation-2026-09-13','head':__import__('subprocess').check_output(['git','rev-parse','HEAD'],text=True).strip(),'archive':b['archive'],'archive_sha256':b['archive_sha256'],'archive_bytes':b['archive_bytes'],'source_files':b['source_files'],'targeted_green':b['final_targeted_green'],'grouped_qa':b['final_zip_grouped_qa'],'installed_live_e2e':'NOT_RUN / LIVE_UNVERIFIED'}
          (r/'REMOTE_READBACK.json').write_text(json.dumps(rb,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(rb,ensure_ascii=False,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$RELEASE/REMOTE_READBACK.json"
          git commit -m 'qa: persist v1.0.42 independent remote readback'
          git push origin "HEAD:$BRANCH"
