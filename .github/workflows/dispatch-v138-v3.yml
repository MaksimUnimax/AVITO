name: Dispatch corrected v1.0.38 v3 gate
on:
  push:
    branches: [fix/v138-avito-sticky-recovery-2026-09-13]
    paths: ['.github/workflows/dispatch-v138-v3.yml']
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch full v3 gate on current branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-avito-v138-v3.yml --repo MaksimUnimax/AVITO --ref fix/v138-avito-sticky-recovery-2026-09-13
