name: Build and verify Avito Finder v1.0.36
on:
  push:
    paths:
      - '.github/workflows/build-avito-v136.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: avito-v136-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      checked_commit: ${{ steps.finish.outputs.commit }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated test dependencies and verify persisted tooling bytes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          echo 'b9ce8b7d98c948a14b9c41e9446b250a5a6fa09872ab25b9fc5c48cb4c05d867  tools/build_avito_v136.py' | sha256sum -c -
          echo '79829848dd3c0775c82cd526ba79a49c4776c3f98f8eeba0262fcb1103aa269d  tools/run_avito_release_qa_v136.py' | sha256sum -c -
          echo 'b8a6156e08ff6aa6afe8e44e98f279403f50e9193b9dc107aa0aa4ade57e2269  tools/check_packaged_adapter_v136.py' | sha256sum -c -
          echo '0b5bd55178276f7d5b4b22289e65bf2dcdcb9cb905679410c5521cb84377a670  tools/packaged_version_contract_v136.test.js' | sha256sum -c -
          echo '032977659d7ae6e05520f33bb7c4fa49a57ed9bfc385c7f123a89b7cecd65e49  tools/package_avito_v136.py' | sha256sum -c -
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
          BROWSER=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          echo "CHROMIUM=$BROWSER" >> "$GITHUB_ENV"
          # Normal browser installation on this disposable runner; no policy changes.
          if [ ! -e /usr/bin/chromium ]; then sudo ln -s "$BROWSER" /usr/bin/chromium; fi
          echo "AF_ROOT=$GITHUB_WORKSPACE/подбор авито расширение" >> "$GITHUB_ENV"
      - name: Reproduce exact v135 RED before building
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$AF_ROOT/QA_v1.0.36"
          set +e
          python tools/check_packaged_adapter_v136.py "$AF_ROOT/v135_work" "$AF_ROOT/QA_v1.0.36/red_identity.json"
          CODE=$?
          set -e
          test "$CODE" -eq 1
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['AF_ROOT'])/'QA_v1.0.36/red_identity.json').read_text())
          assert r['status']=='FAIL' and r['manifest_version']=='1.0.35' and r['actual_adapter_ping']['version']=='1.0.34'
          PY
      - name: Build source and final ZIP; persist before long QA
        shell: bash
        run: |
          set -euo pipefail
          TMP_BUILD=$(mktemp -d)
          python tools/build_avito_v136.py "$AF_ROOT/AVITO_FINDER_v1.0.35_ASSISTANT_FORM_TERMINAL_GATE_2026-09-12.zip" "$TMP_BUILD/v136_work"
          if [ -d "$AF_ROOT/v136_work" ]; then
            diff -qr "$TMP_BUILD/v136_work" "$AF_ROOT/v136_work"
          else
            cp -a "$TMP_BUILD/v136_work" "$AF_ROOT/v136_work"
          fi
          python tools/package_avito_v136.py "$AF_ROOT/v136_work" "$AF_ROOT/AVITO_FINDER_v1.0.36_PACKAGED_ADAPTER_CONSISTENCY_2026-09-12.zip"
          FINAL_ROOT=$(mktemp -d)
          export FINAL_ROOT
          python - <<'PY'
          import json,os,zipfile
          from pathlib import Path
          root=Path(os.environ['AF_ROOT'])
          with zipfile.ZipFile(root/'AVITO_FINDER_v1.0.36_PACKAGED_ADAPTER_CONSISTENCY_2026-09-12.zip') as z:
              assert z.testzip() is None
              z.extractall(os.environ['FINAL_ROOT'])
          (root/'CHECKPOINT_v1.0.36_BUILD.json').write_text(json.dumps({'version':'1.0.36','status':'SOURCE_AND_ZIP_SAVED_FULL_ZIP_QA_PENDING','runtime_changed':['manifest.json','avito_content.js'],'live_acceptance':'NOT_RUN'},indent=2)+'\n')
          PY
          echo "FINAL_SOURCE=$FINAL_ROOT/v136_work" >> "$GITHUB_ENV"
          git add -- "$AF_ROOT/v136_work" "$AF_ROOT/AVITO_FINDER_v1.0.36_PACKAGED_ADAPTER_CONSISTENCY_2026-09-12.zip" "$AF_ROOT/BUILD_v1.0.36.json" "$AF_ROOT/QA_v1.0.36" "$AF_ROOT/CHECKPOINT_v1.0.36_BUILD.json"
          if ! git diff --cached --quiet; then git commit -m 'build: persist v1.0.36 source and exact ZIP before full QA'; git push origin HEAD:main; fi
      - name: Full regression from freshly extracted final ZIP, checkpoint every group
        env:
          AF_QA_GIT_CHECKPOINT: '1'
        shell: bash
        run: |
          set -euo pipefail
          export AF_QA_OUTPUT="$AF_ROOT/QA_v1.0.36/final_zip"
          python -u "$FINAL_SOURCE/tests/run_all_v136.py"
      - name: Persist exact acceptance status, including any failure
        id: finish
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AF_ROOT:-}"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['AF_ROOT']);q=root/'QA_v1.0.36/final_zip/summary.json'
          s=json.loads(q.read_text()) if q.exists() else {}
          passed=s.get('complete') is True and s.get('fail')==0
          out={'version':'1.0.36','status':'FULL_FINAL_ZIP_QA_PASS_LIVE_UNVERIFIED' if passed else 'NOT_READY_QA_INCOMPLETE_OR_FAILED','qa_complete':s.get('complete',False),'groups_pass':s.get('pass',0),'groups_fail':s.get('fail',0),'installed_live_acceptance':'NOT_RUN','next':'independent remote readback, then owner Chrome acceptance' if passed else 'inspect persisted FAIL; never label as ready'}
          (root/'CHECKPOINT_v1.0.36_BUILD.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out))
          PY
          git add -- "$AF_ROOT/CHECKPOINT_v1.0.36_BUILD.json" "$AF_ROOT/QA_v1.0.36"
          if ! git diff --cached --quiet; then git commit -m 'checkpoint: persist complete v1.0.36 final ZIP QA status'; git push origin HEAD:main; fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avito-v136-build-and-qa
          path: |
            подбор авито расширение/AVITO_FINDER_v1.0.36_PACKAGED_ADAPTER_CONSISTENCY_2026-09-12.zip
            подбор авито расширение/BUILD_v1.0.36.json
            подбор авито расширение/QA_v1.0.36/
            подбор авито расширение/CHECKPOINT_v1.0.36_BUILD.json
          if-no-files-found: error
  remote-readback:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.checked_commit }}
          fetch-depth: 0
      - name: Read ZIP and all source bytes from a separate fresh checkout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,subprocess,zipfile,re
          from pathlib import Path
          root=Path('подбор авито расширение');m=json.loads((root/'BUILD_v1.0.36.json').read_text())
          q=json.loads((root/'QA_v1.0.36/final_zip/summary.json').read_text());assert q['complete'] and q['fail']==0
          p=root/m['archive'];data=p.read_bytes();assert hashlib.sha256(data).hexdigest()==m['archive_sha256'] and len(data)==m['archive_bytes']
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert len(z.namelist())==m['source_files']
              for n,h in m['source_hashes'].items():
                  a=z.read('v136_work/'+n);b=(root/'v136_work'/n).read_bytes()
                  assert a==b and hashlib.sha256(a).hexdigest()==h,n
          origin=json.loads((root/'v136_work/BUILD_ORIGIN_v1.0.36.json').read_text())
          for n,hashes in origin['runtime_hashes'].items():
              assert hashlib.sha256((root/'v135_work'/n).read_bytes()).hexdigest()==hashes['before']
              assert hashlib.sha256((root/'v136_work'/n).read_bytes()).hexdigest()==hashes['after']
          receipt={'scope':'INDEPENDENT_FRESH_GITHUB_CHECKOUT_FINAL_ZIP_AND_ALL_SOURCE_BYTES','verified_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'version':'1.0.36','archive':m['archive'],'sha256':m['archive_sha256'],'bytes':len(data),'source_files_byte_equal':m['source_files'],'runtime_changed':origin['runtime_changed'],'full_zip_qa_groups_pass':q['pass'],'full_zip_qa_groups_fail':q['fail'],'status':'PASS','installed_live_acceptance':'NOT_RUN'}
          (root/'REMOTE_READBACK_v1.0.36.json').write_text(json.dumps(receipt,indent=2)+'\n');print(json.dumps(receipt))
          PY
      - name: Persist remote readback receipt without force
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'подбор авито расширение/REMOTE_READBACK_v1.0.36.json'
          if ! git diff --cached --quiet; then git commit -m 'qa: persist independent v1.0.36 final ZIP remote readback'; git push origin HEAD:main; fi
      - uses: actions/upload-artifact@v4
        with:
          name: avito-v136-final-remote-verified
          path: |
            подбор авито расширение/AVITO_FINDER_v1.0.36_PACKAGED_ADAPTER_CONSISTENCY_2026-09-12.zip
            подбор авито расширение/BUILD_v1.0.36.json
            подбор авито расширение/QA_v1.0.36/
            подбор авито расширение/REMOTE_READBACK_v1.0.36.json
          if-no-files-found: error
