name: RED Avito Finder v1.0.43 IP recovery evidence

on:
  push:
    branches:
      - fix/v143-ip-recovery-egress-proof-2026-09-14
    paths:
      - 'подбор авито расширение/v143_prepatch_tests/**'
      - '.github/workflows/red-avito-v143.yml'
      - 'подбор авито расширение/PRE_PATCH_FULL_HISTORY_AUDIT_v1.0.43_2026-09-14.*'
      - 'подбор авито расширение/PRE_PATCH_FULL_HISTORY_AUDIT_v1.0.43_REMOTE_READBACK_2026-09-14.json'

permissions:
  contents: write

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v143-ip-recovery-egress-proof-2026-09-14
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Rule 20 v1.0.43 gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('подбор авито расширение')
          a=json.loads((root/'PRE_PATCH_FULL_HISTORY_AUDIT_v1.0.43_2026-09-14.json').read_text())
          rb=json.loads((root/'PRE_PATCH_FULL_HISTORY_AUDIT_v1.0.43_REMOTE_READBACK_2026-09-14.json').read_text())
          assert a['status']=='FULL_HISTORY_AUDIT=PASS',a
          assert a['installed_exact_target']=='v1.0.42',a
          assert a['runtime_patch_authorized'] is False,a
          assert rb['status']=='PASS',rb
          print('Rule20 v1.0.43 pre-patch gate PASS')
          PY
      - name: Exact v1.0.42 must fail the new terminal-evidence regression
        id: red
        shell: bash
        run: |
          set +e
          node --test 'подбор авито расширение/v143_prepatch_tests/ip_recovery_terminal_evidence_v142.test.js' > /tmp/v143-red.tap 2>&1
          code=$?
          set -e
          cat /tmp/v143-red.tap
          test "$code" -ne 0
          grep -q 'terminal exhaustion report must preserve measured probe and endpoint evidence' /tmp/v143-red.tap
          grep -q 'terminal exhaustion report must distinguish unresolved create from generic exhaustion' /tmp/v143-red.tap
          mkdir -p 'подбор авито расширение/releases/v1.0.43/QA/red'
          cp /tmp/v143-red.tap 'подбор авито расширение/releases/v1.0.43/QA/red/RED.tap'
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('подбор авито расширение/releases/v1.0.43/QA/red/RED.json')
          p.write_text(json.dumps({
            'schema':'avito_finder_v143_red_v1',
            'date':'2026-09-14',
            'source_version':'1.0.42',
            'target':'v1.0.43 IP recovery terminal evidence preservation',
            'status':'RED_CONFIRMED',
            'runtime_changed_before_red':False,
            'live_task':'af-20260914010021-tyyl',
            'live_reason':'AVITO_IP_BLOCK_RECOVERY_EXHAUSTED',
            'live_post_failure_dom':'AVITO_IP_BLOCK',
            'failed_invariants':[
              'terminal exhaustion report exposes measured egress before/after and whether it changed',
              'terminal exhaustion report exposes endpoint-create skip/unresolved state',
              'terminal exhaustion report exposes egress diagnostic error when probes are incomplete'
            ],
            'next_authorized_action':'minimal diagnostic/evidence-preservation patch only; recovery behavior remains unchanged until new live evidence identifies the failing substep'
          },ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Persist RED evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'подбор авито расширение/releases/v1.0.43/QA/red'
          if ! git diff --cached --quiet; then
            git commit -m 'qa: persist exact v1.0.42 IP recovery evidence RED'
            git push origin HEAD:fix/v143-ip-recovery-egress-proof-2026-09-14
          fi
