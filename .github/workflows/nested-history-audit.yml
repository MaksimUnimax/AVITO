name: Nested Avito Finder archive audit
on:
  push:
    branches: [audit/full-history-2026-09-13]
    paths:
      - 'tools/scan_nested_history_archives.py'
      - '.github/workflows/nested-history-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --all --tags --prune
      - name: Scan all exact historical ZIP variants
        run: python3 tools/scan_nested_history_archives.py nested-history-output
      - run: cat nested-history-output/SUMMARY.json
      - name: Enforce audit-only branch
        shell: bash
        run: |
          set -euo pipefail
          base=$(git merge-base origin/main HEAD)
          changed=$(git -c core.quotepath=false diff --name-only "$base"..HEAD)
          if printf '%s\n' "$changed" | grep -E '(^|/)(manifest\.json|service_worker\.js|chatgpt_content\.js|avito_content\.js|core\.js|proxy_manager\.js|recovery\.js|popup\.js|popup\.html|popup\.css)$'; then
            echo AUDIT_BRANCH_RUNTIME_CHANGE_FORBIDDEN >&2; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: avito-nested-history-audit
          path: nested-history-output/
          retention-days: 90
          if-no-files-found: error
