name: Materialize Avito Finder v1.0.6

on:
  push:
    branches: [main]
    paths:
      - '.github/avito-upload/READY'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild exact ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat .github/avito-upload/part-*.txt > /tmp/avito-v1.0.6.b64
          base64 -d /tmp/avito-v1.0.6.b64 > AVITO_FINDER_v1.0.6_optional-login-observation-report_TEST_CANDIDATE.zip
          echo '32e1523e1f0d9d8ff0b5f71f6e9df146542f80327628cd48d35bff73d90d31e9  AVITO_FINDER_v1.0.6_optional-login-observation-report_TEST_CANDIDATE.zip' | sha256sum -c -

      - name: Replace obsolete package
        shell: bash
        run: |
          set -euo pipefail
          rm -f AVITO_FINDER_v1.0.1_popup-assistant-protocol-prompt_TEST_CANDIDATE.zip
          rm -rf .github/avito-upload
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: replace Avito Finder v1.0.1 with v1.0.6'
          git push
