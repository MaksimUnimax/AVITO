name: Build and verify Avito Finder v1.0.43 IP recovery evidence preservation
on:
  push:
    branches: [fix/v143-ip-recovery-egress-proof-2026-09-14]
    paths:
      - '.github/workflows/build-avito-v143.yml'
      - 'tools/materialize_avito_v143.py'
      - 'подбор авито расширение/v143_prepatch_tests/ip_recovery_terminal_evidence_green.test.js'
      - 'подбор авито расширение/releases/v1.0.43/QA/red/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: avito-v143-ip-recovery-evidence-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      BRANCH: fix/v143-ip-recovery-egress-proof-2026-09-14
      RELEASE: подбор авито расширение/releases/v1.0.43
      WORK: подбор авито расширение/releases/v1.0.43/v143_work
      ZIP: подбор авито расширение/releases/v1.0.43/AVITO_FINDER_v1.0.43_IP_RECOVERY_EVIDENCE_PRESERVATION_2026-09-14.zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v143-ip-recovery-egress-proof-2026-09-14
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Prepare Chromium
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
          BROWSER=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          echo "CHROMIUM=$BROWSER" >> "$GITHUB_ENV"
          if [ ! -e /usr/bin/chromium ]; then sudo ln -s "$BROWSER" /usr/bin/chromium; fi
      - name: Verify Rule 20 and exact-v1.0.42 RED
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('подбор авито расширение')
          a=json.loads((root/'PRE_PATCH_FULL_HISTORY_AUDIT_v1.0.43_2026-09-14.json').read_text())
          rb=json.loads((root/'PRE_PATCH_FULL_HISTORY_AUDIT_v1.0.43_REMOTE_READBACK_2026-09-14.json').read_text())
          red=json.loads((root/'releases/v1.0.43/QA/red/RED.json').read_text())
          assert a['status']=='FULL_HISTORY_AUDIT=PASS' and a['installed_exact_target']=='v1.0.42',a
          assert rb['status']=='PASS',rb
          assert red['status']=='RED_CONFIRMED' and red['source_version']=='1.0.42',red
          assert red['runtime_changed_before_red'] is False,red
          print('Rule20 + exact v1.0.42 RED authority PASS')
          PY
      - name: Materialize minimal v1.0.43 from exact v1.0.42
        shell: bash
        run: |
          set -euo pipefail
          python tools/materialize_avito_v143.py | tee /tmp/materialize_v143.log
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('подбор авито расширение/releases/v1.0.42/v142_work')
          work=Path('подбор авито расширение/releases/v1.0.43/v143_work')
          o=json.loads((work/'BUILD_ORIGIN_v1.0.43.json').read_text());m=json.loads((work/'manifest.json').read_text())
          assert m['version']=='1.0.43',m
          assert o['runtime_behavior_changed']==['service_worker.js'],o
          assert o['identity_only_changed']==['avito_content.js','manifest.json'],o
          assert o['recovery_behavior_changed'] is False,o
          assert (base/'proxy_manager.js').read_bytes()==(work/'proxy_manager.js').read_bytes()
          assert (base/'chatgpt_content.js').read_bytes()==(work/'chatgpt_content.js').read_bytes()
          assert (base/'core.js').read_bytes()==(work/'core.js').read_bytes()
          assert (base/'recovery.js').read_bytes()==(work/'recovery.js').read_bytes()
          print('minimal diagnostic-only materialization PASS')
          PY
      - name: Targeted GREEN — terminal recovery evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE/QA"
          AF_SOURCE_ROOT="$GITHUB_WORKSPACE/$WORK" node --test 'подбор авито расширение/v143_prepatch_tests/ip_recovery_terminal_evidence_green.test.js' | tee "$RELEASE/QA/targeted_green.tap"
          echo '{"schema":"avito_finder_v143_targeted_green","status":"PASS","tests":"2/2 PASS"}' > "$RELEASE/QA/targeted_green.json"
      - name: Full historical regression — worktree
        shell: bash
        run: |
          set -euo pipefail
          AF_QA_OUTPUT="$RELEASE/QA/worktree" python -u "$WORK/tests/run_all_v136.py"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('подбор авито расширение/releases/v1.0.43/QA/worktree/summary.json');r=json.loads(p.read_text())
          assert r['complete'] and r['fail']==0,r
          print('worktree grouped QA PASS',r['pass'])
          PY
      - name: Package exact final source and write build authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          rel=Path('подбор авито расширение/releases/v1.0.43');work=rel/'v143_work';zpath=rel/'AVITO_FINDER_v1.0.43_IP_RECOVERY_EVIDENCE_PRESERVATION_2026-09-14.zip'
          if zpath.exists(): zpath.unlink()
          files=sorted(p for p in work.rglob('*') if p.is_file())
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for p in files:
              info=zipfile.ZipInfo(str(Path('v143_work')/p.relative_to(work)).replace('\\','/'),date_time=(2020,1,1,0,0,0));info.compress_type=zipfile.ZIP_DEFLATED;info.external_attr=(0o100644<<16);z.writestr(info,p.read_bytes())
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest();wqa=json.loads((rel/'QA/worktree/summary.json').read_text())
          build={'schema':'avito_finder_build_v143','version':'1.0.43','base_version':'1.0.42','archive':zpath.name,'archive_sha256':sha(zpath),'archive_bytes':zpath.stat().st_size,'source_files':len(files),'purpose':'IP recovery terminal evidence preservation; recovery behavior unchanged','runtime_behavior_changed':['service_worker.js'],'identity_only_changed':['avito_content.js','manifest.json'],'runtime_unchanged':['chatgpt_content.js','core.js','proxy_manager.js','recovery.js'],'recovery_behavior_changed':False,'capture_version':'0.6.19','service_worker_sha256':sha(work/'service_worker.js'),'proxy_manager_sha256':sha(work/'proxy_manager.js'),'chatgpt_content_sha256':sha(work/'chatgpt_content.js'),'avito_content_sha256':sha(work/'avito_content.js'),'manifest_sha256':sha(work/'manifest.json'),'targeted_green':'2/2 PASS','worktree_grouped_qa':f"{wqa['pass']}/{wqa['pass']} PASS",'installed_live_e2e':'NOT_RUN / LIVE_UNVERIFIED','release_role':'DIAGNOSTIC_CORRECTIVE_BUILD'}
          (rel/'BUILD_v1.0.43.json').write_text(json.dumps(build,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(build,ensure_ascii=False,indent=2))
          PY
      - name: Fresh-extract targeted GREEN and full regression
        shell: bash
        run: |
          set -euo pipefail
          FINAL="$RUNNER_TEMP/v143_final"; rm -rf "$FINAL"; mkdir -p "$FINAL"; export FINAL
          python - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          r=Path('подбор авито расширение/releases/v1.0.43');b=json.loads((r/'BUILD_v1.0.43.json').read_text());z=r/b['archive']
          assert hashlib.sha256(z.read_bytes()).hexdigest()==b['archive_sha256']
          with zipfile.ZipFile(z) as f:
            assert f.testzip() is None and len(f.namelist())==b['source_files'];f.extractall(os.environ['FINAL'])
          PY
          AF_SOURCE_ROOT="$FINAL/v143_work" node --test 'подбор авито расширение/v143_prepatch_tests/ip_recovery_terminal_evidence_green.test.js' | tee "$RELEASE/QA/final_targeted_green.tap"
          AF_QA_OUTPUT="$RELEASE/QA/final_zip" python -u "$FINAL/v143_work/tests/run_all_v136.py"
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('подбор авито расширение/releases/v1.0.43');a=json.loads((r/'QA/worktree/summary.json').read_text());b=json.loads((r/'QA/final_zip/summary.json').read_text());build=json.loads((r/'BUILD_v1.0.43.json').read_text())
          assert a['complete'] and a['fail']==0,a
          assert b['complete'] and b['fail']==0,b
          assert a['pass']==b['pass'],(a,b)
          build['final_zip_grouped_qa']=f"{b['pass']}/{b['pass']} PASS";build['final_targeted_green']='2/2 PASS';build['final_zip_fresh_extract']='PASS'
          (r/'BUILD_v1.0.43.json').write_text(json.dumps(build,ensure_ascii=False,indent=2)+'\n')
          print('fresh-extract QA PASS',b['pass'])
          PY
      - name: Persist exact source ZIP and QA
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$RELEASE"
          git commit -m 'release: materialize Avito Finder v1.0.43 recovery evidence candidate'
          git push origin "HEAD:$BRANCH"
  remote_readback:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRANCH: fix/v143-ip-recovery-egress-proof-2026-09-14
      RELEASE: подбор авито расширение/releases/v1.0.43
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v143-ip-recovery-egress-proof-2026-09-14
          fetch-depth: 0
      - name: Independent remote readback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"; test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$BRANCH)"
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          r=Path('подбор авито расширение/releases/v1.0.43');b=json.loads((r/'BUILD_v1.0.43.json').read_text());z=r/b['archive'];work=r/'v143_work';sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          assert sha(z)==b['archive_sha256']; assert sha(work/'service_worker.js')==b['service_worker_sha256'];assert sha(work/'proxy_manager.js')==b['proxy_manager_sha256'];assert sha(work/'chatgpt_content.js')==b['chatgpt_content_sha256'];assert json.loads((work/'manifest.json').read_text())['version']=='1.0.43';assert b['final_zip_fresh_extract']=='PASS'
          rb={'schema':'avito_finder_v143_remote_readback','version':'1.0.43','status':'PASS','branch':'fix/v143-ip-recovery-egress-proof-2026-09-14','head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'archive':b['archive'],'archive_sha256':b['archive_sha256'],'archive_bytes':b['archive_bytes'],'source_files':b['source_files'],'targeted_green':b['final_targeted_green'],'grouped_qa':b['final_zip_grouped_qa'],'recovery_behavior_changed':False,'installed_live_e2e':'NOT_RUN / LIVE_UNVERIFIED'}
          (r/'REMOTE_READBACK.json').write_text(json.dumps(rb,ensure_ascii=False,indent=2)+'\n');print(json.dumps(rb,ensure_ascii=False,indent=2))
          PY
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$RELEASE/REMOTE_READBACK.json";git commit -m 'qa: persist v1.0.43 independent remote readback';git push origin "HEAD:$BRANCH"
